[package]
name = "__APP_SLUG__"
version = "0.1.0"
description = "__APP_NAME__ mobile application"
edition = "2024"
rust-version = "1.90"

[lib]
# Android and iOS load the app as a library; the fixed name keeps main.rs stable,
# and the `_lib` suffix avoids a Windows name clash with the desktop binary.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
# Mobile plugins added with `bash start.sh capability install <id>` are appended below this line.

# Smaller, faster release binaries (https://v2.tauri.app/concept/size/).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
